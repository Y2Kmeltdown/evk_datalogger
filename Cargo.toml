[package]
name = "evk_datalogger"
version = "0.1.0"
edition = "2024"

[dependencies]
neuromorphic-drivers = "0.17.0"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
array2d = "0.3.2"

[[bin]]
name = "viewfinder"
path = "src/bin/viewfinder.rs"
 
[[bin]]
name = "replay"
path = "src/bin/replay.rs"
